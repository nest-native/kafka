version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    groups:
      dev-tooling-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      # Majors are grouped deliberately, not just minors and patches. The
      # @nestjs/* packages are a set with peer dependencies on each other, so a
      # major that arrives one-package-per-PR produces a tree npm refuses to
      # install: NestJS 12 opened fifteen separate PRs across this org, each
      # bumping one package and leaving its siblings on 11, and every one failed
      # `npm ci` with ERESOLVE before a single test ran. Grouped, a major
      # arrives as one PR that can actually be evaluated.
      nest-kafka-peer:
        update-types:
          - "major"
          - "minor"
          - "patch"
        patterns:
          - "@confluentinc/kafka-javascript"
          - "@nestjs/common"
          - "@nestjs/core"
          - "@nestjs/microservices"
          - "@nestjs/platform-express"
          - "@nestjs/platform-fastify"
          - "class-validator"
          - "reflect-metadata"
          - "rxjs"
          - "zod"
          - "@nestjs/testing"

  # The docs site is its own npm project (website/package-lock.json), outside
  # the root workspaces, so the "/" entry above never sees it: until this entry
  # existed its advisories went unreported, and an audit on 2026-09-29 found 29.
  # Docusaurus packages move in lockstep, so they arrive as one group.
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "docs"
      include: "scope"
    groups:
      docusaurus:
        patterns:
          - "@docusaurus/*"
      docs-minor-patch:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
      include: "scope"
