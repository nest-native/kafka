name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  package-build:
    name: Package build/typecheck (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build --workspace @nest-native/kafka

      - name: Typecheck package
        run: npm run typecheck --workspace @nest-native/kafka

  package-test-node-22:
    name: Package tests/coverage (Node 22)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:cov

  package-quality:
    name: Tests, coverage, and complexity (Node 22)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Restore base branch CI data
        if: github.event_name == 'pull_request'
        id: base-ci-data
        uses: actions/cache/restore@v6
        with:
          path: ci-data
          key: ci-data-node-22-${{ github.base_ref }}-
          restore-keys: ci-data-node-22-${{ github.base_ref }}-

      - name: Extract base CI data
        if: steps.base-ci-data.outputs.cache-matched-key
        run: |
          cp ci-data/coverage-summary.json base-coverage-summary.json 2>/dev/null || true
          cp ci-data/test-results.json base-test-results.json 2>/dev/null || true
          cp ci-data/test-step-duration-ms.txt base-test-step-duration-ms.txt 2>/dev/null || true
          cp ci-data/cognitive-complexity-summary.json base-cognitive-complexity-summary.json 2>/dev/null || true

      - name: Run tests with coverage
        run: |
          START=$SECONDS
          npm run test:cov
          echo $(( (SECONDS - START) * 1000 )) > test-step-duration-ms.txt

      - name: Enforce cognitive complexity threshold
        run: npm run complexity:check

      - name: Generate cognitive complexity report
        run: npm run complexity:report

      - name: Generate base cognitive complexity fallback
        if: github.event_name == 'pull_request'
        run: |
          if [ -f base-cognitive-complexity-summary.json ]; then
            exit 0
          fi

          BASE_DIR="$(mktemp -d)"
          cleanup() {
            git worktree remove --force "$BASE_DIR" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          git worktree add --detach "$BASE_DIR" "${{ github.event.pull_request.base.sha }}"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$BASE_DIR/node_modules"
          (
            cd "$BASE_DIR"
            if [ -f scripts/collect-cognitive-complexity.mjs ]; then
              node scripts/collect-cognitive-complexity.mjs \
                --output "$GITHUB_WORKSPACE/base-cognitive-complexity-summary.json"
            fi
          )

      - name: Cache CI data for base branch
        if: github.event_name == 'push'
        run: |
          mkdir -p ci-data
          cp coverage/coverage-summary.json ci-data/coverage-summary.json
          cp test-results.json ci-data/test-results.json
          cp test-step-duration-ms.txt ci-data/test-step-duration-ms.txt
          cp complexity/cognitive-complexity-summary.json ci-data/cognitive-complexity-summary.json

      - if: github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: ci-data
          key: ci-data-node-22-${{ github.ref_name }}-${{ github.sha }}

      - name: Get changed files
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'packages/**/*.ts' | tee changed-files.txt

      - name: Coverage Report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const report = require('./.github/scripts/coverage-report.js');
            await report({ github, context, core });

      - name: Performance Report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const report = require('./.github/scripts/performance-report.js');
            await report({ github, context, core });

      - name: Complexity Report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const report = require('./.github/scripts/complexity-report.js');
            await report({ github, context, core });

      - name: Coverage and performance summary
        run: |
          node -e "
          const fs = require('node:fs');
          const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8')).total;
          const duration = fs.readFileSync('test-step-duration-ms.txt', 'utf8').trim();
          const metrics = {
            statements: summary.statements.pct,
            branches: summary.branches.pct,
            functions: summary.functions.pct,
            lines: summary.lines.pct,
          };
          const report = [
            '### Package Quality',
            '',
            '| Metric | Value |',
            '| :--- | ---: |',
            '| Statements | ' + metrics.statements + '% |',
            '| Branches | ' + metrics.branches + '% |',
            '| Functions | ' + metrics.functions + '% |',
            '| Lines | ' + metrics.lines + '% |',
            '| Test step duration | ' + duration + ' ms |',
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, report + '\n');
          "

      - name: Upload quality artifacts
        uses: actions/upload-artifact@v7
        with:
          name: package-quality
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
            complexity/cognitive-complexity-summary.json
            test-results.json
            test-step-duration-ms.txt
          if-no-files-found: error

  nestjs-compat:
    name: NestJS ${{ matrix.nest.label }} compatibility (Node 22)
    runs-on: ubuntu-latest
    # The published peer range is @nestjs/* ^11 || ^12. The devDependencies and
    # the lockfile every other job installs stay on the 11.x in the middle of
    # that range, so this matrix is what makes its two ENDS tested claims: each
    # leg installs one end on top of the lockfile with --no-save and runs the
    # unit suite, the package build, and the sample matrix against it.
    #
    # Three things keep a leg honest, because npm makes it easy to run a suite
    # against a tree that is not the one you asked for:
    # - --workspaces --include-workspace-root: the samples pin @nestjs/* to an
    #   exact 11.x, and a root-only install leaves them a nested 11 while the
    #   root moves.
    # - the install log is grepped for ERESOLVE: when npm can override a peer
    #   conflict it prints a warning and exits 0, and neither `npm ls` nor
    #   --strict-peer-deps reports it afterwards.
    # - scripts/check-nestjs-resolution.mjs proves the version from inside
    #   every workspace (exactly, at the floor) and re-checks every peer range
    #   on @nestjs/* against the hoisted copy.
    # Node is not a dimension here on purpose: 22 floats to a current 22.x,
    # which is what require(esm) on the 12 end needs (>=22.12), and the build
    # job already covers 24.
    strategy:
      fail-fast: false
      matrix:
        nest:
          # 11.0.0 is the oldest graph the published range can produce: nothing
          # this package uses was added by a later 11.x — every @nestjs/core
          # internal it deep-imports exists with the same signature at 11.0.0
          # (nest commits adc7e1547, f98149853, c5b71643e, 762754607, 4d9c18801
          # are additive). Pinned exactly so a downgrade that silently no-ops
          # cannot pass as a floor run. @nestjs/testing is pinned with the
          # rest: it is released in lockstep with core, and a floor leg with
          # testing floating is not testing the floor.
          - { label: '11 floor', spec: '11.0.0' }
          # ^12.0.0 floats, so a new 12.x patch is tested on the next run.
          - { label: '12', spec: '^12.0.0' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install NestJS ${{ matrix.nest.label }} (this job only, never saved)
        run: |
          npm install --no-save --workspaces --include-workspace-root \
            "@nestjs/common@${{ matrix.nest.spec }}" \
            "@nestjs/core@${{ matrix.nest.spec }}" \
            "@nestjs/microservices@${{ matrix.nest.spec }}" \
            "@nestjs/testing@${{ matrix.nest.spec }}" \
            > "$RUNNER_TEMP/nestjs-install.log" 2>&1 || { cat "$RUNNER_TEMP/nestjs-install.log"; exit 1; }
          cat "$RUNNER_TEMP/nestjs-install.log"

      - name: Fail on any peer conflict npm merely warned about
        run: |
          if grep -E 'ERESOLVE' "$RUNNER_TEMP/nestjs-install.log"; then
            echo "::error::npm overrode a peer dependency instead of failing; this tree is not the graph the leg claims to test"
            exit 1
          fi

      - name: Prove every workspace resolves NestJS ${{ matrix.nest.label }}
        run: node scripts/check-nestjs-resolution.mjs "${{ matrix.nest.spec }}"

      - name: Run the unit suite against NestJS ${{ matrix.nest.label }}
        run: npm test

      - name: Build the package against NestJS ${{ matrix.nest.label }}
        run: npm run build --workspace @nest-native/kafka

      - name: Run the sample matrix against NestJS ${{ matrix.nest.label }}
        run: npm run ci:sample

  release-and-security:
    name: Release and security checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Validate package tarball
        run: npm run release:check

      - name: Audit production supply chain
        run: npm run security:audit

  samples:
    name: Sample validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build --workspace @nest-native/kafka

      - name: Run sample matrix
        run: |
          START=$SECONDS
          npm run ci:sample
          echo $(( (SECONDS - START) * 1000 )) > sample-validation-duration-ms.txt

      - name: Sample matrix summary
        run: |
          DURATION_MS="$(cat sample-validation-duration-ms.txt)"
          DURATION_SECONDS="$(node -e "console.log((Number(process.argv[1]) / 1000).toFixed(2))" "$DURATION_MS")"
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Sample Matrix

          | Metric | Value |
          | :--- | ---: |
          | Sample validation duration | DURATION_PLACEHOLDER |

          | Sample | CI behavior |
          | :--- | :--- |
          | `00-showcase` | In-memory loopback broker; no broker required |
          | `01-producer-basics` | In-memory loopback driver; no broker required |
          | `02-consumer-enhancers` | In-memory loopback broker; no broker required |
          | `03-headers-context-errors` | In-memory loopback broker; no broker required |
          | `04-batch-concurrency` | In-memory loopback broker; no broker required |
          | `05-transactions` | In-memory transactional broker; no broker required |
          | `06-microservice-migration` | In-memory `KafkaTestModule` broker; no broker required |
          | `07-request-reply` | In-memory `KafkaTestModule` broker; no broker required |

          Set `KAFKA_BROKERS` to run the same sample against a real Kafka cluster
          through Confluent's client. Broker credentials are never printed in this
          summary. The dedicated `integration` job exercises a real produce ->
          consume round-trip, a transactional commit, per-topic concurrency,
          broker-restart recovery, and the request-reply cases (cross-context
          round trip, reply affinity across three instances, a request spanning
          a restart, and byte-level interop with `@nestjs/microservices`)
          against a single-node KRaft Kafka.
          EOF
          sed -i "s/DURATION_PLACEHOLDER/${DURATION_SECONDS}s (${DURATION_MS}ms)/" "$GITHUB_STEP_SUMMARY"

  integration:
    name: Real-broker integration (KRaft Kafka)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      # `@confluentinc/kafka-javascript` is an optional peer (the published
      # package keeps `"dependencies": {}`), so it is installed only for this job
      # and never saved to package.json / package-lock.json.
      - name: Install the optional Confluent client (this job only)
        run: npm i --no-save "@confluentinc/kafka-javascript@^1.9"

      - name: Start a single-node KRaft Kafka
        run: |
          docker run -d --name kafka -p 9092:9092 \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
            -e KAFKA_AUTO_CREATE_TOPICS_ENABLE=true \
            -e CLUSTER_ID=5L6g3nShT-eMCtK--X86sw \
            apache/kafka:3.8.1

      - name: Wait for the broker to accept requests
        run: |
          for attempt in $(seq 1 60); do
            if docker exec kafka /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server localhost:9092 --list >/dev/null 2>&1; then
              echo "Broker is ready after ${attempt} attempt(s)."
              exit 0
            fi
            echo "Waiting for broker (attempt ${attempt})..."
            sleep 2
          done
          echo "Broker did not become ready in time." >&2
          docker logs kafka || true
          exit 1

      - name: Check the librdkafka property list against the installed client
        # This job is the only one that installs the optional Confluent peer, so
        # it is the only place the drift guard can actually run — everywhere else
        # it skips, which would make it a gate in name only.
        run: npm run test:peer-drift

      - name: Run the real-broker integration suite
        env:
          KAFKA_BROKERS: localhost:9092
          # Lets the suite restart this container to prove the client recovers
          # from a broker outage without the application restarting.
          KAFKA_RESTART_CONTAINER: kafka
        run: npm run test:integration

      - name: Dump broker logs on failure
        if: failure()
        run: docker logs kafka || true

  docs-site:
    name: Docusaurus build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install docs website dependencies
        run: npm --prefix website ci

      - name: Build docs site
        run: npm --prefix website run build
